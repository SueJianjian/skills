name: Publish Docs

on:
  push:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/heads/main') && github.run_number > 1 }}
    env:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
    steps:
      - name: Skip when Fern credentials are unavailable
        if: ${{ env.FERN_TOKEN == '' }}
        run: echo "FERN_TOKEN is not configured; skipping documentation publishing."

      - name: Checkout repository
        if: ${{ env.FERN_TOKEN != '' }}
        uses: actions/checkout@v6

      - name: Install Fern
        if: ${{ env.FERN_TOKEN != '' }}
        run: npm install -g fern-api

      - name: Publish Docs
        if: ${{ env.FERN_TOKEN != '' }}
        run: fern generate --docs
